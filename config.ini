[General]
AppName=DiagSoft
Version=1.0.0
DatabasePath=ventas.db

[UI]
DefaultTheme=light
Language=es

[Paths]
ReportsDirectory=reportes
TemporaryDirectory=temp
ExportsDirectory=exports

[Database]
BackupOnStart=true
AutoBackupInterval=7
MaxBackups=5

[Logging]
LogLevel=INFO
LogFile=diagsoft.log
EnableFileLogging=true
EnableConsoleLogging=true

[Email]
SmtpServer=smtp.example.com
SmtpPort=587
SenderEmail=notificaciones@diagsoft.com
EnableSSL=true

[Performance]
CacheSize=1000
ProductsPerPage=20
SalesPerPage=15
CustomersPerPage=20 